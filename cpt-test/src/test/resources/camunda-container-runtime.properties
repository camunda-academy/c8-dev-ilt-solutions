# Camunda Process Test (CPT) runtime configuration — plain Java variant.
#
# We use REMOTE mode: CPT does NOT spin up its own Testcontainers runtime. Instead it
# connects to a Camunda runtime that YOU start manually (see ../../../start-runtime.sh),
# on fixed, known ports. This is required because the real job workers (python/csharp/js)
# are started manually by you and must connect to the SAME runtime as CPT.
#
# CPT still deletes all process data between test methods via the monitoring API (9600).

runtimeMode=remote

# --- Connection to the manually-started runtime (Camunda 8 defaults) ---
camunda.client.gateway.rest.address=http://localhost:8080
camunda.client.gateway.grpc.address=http://localhost:26500

# Monitoring API — CPT uses this to reset data between tests and to control the clock.
remote.camundaMonitoringApiAddress=http://localhost:9600

# How long CPT waits for the remote runtime to be ready before failing.
remote.runtimeConnectionTimeout=PT1M
